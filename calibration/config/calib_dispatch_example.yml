# Example calib_dispatch config (one run, Hodo → BcOut chamber → D5).
# Usage:
#   ./calib_dispatch.py start calibration/config/calib_dispatch_example.yml --dry-run
#   ./calib_dispatch.py status calibration/config/calib_dispatch_example.yml
#
# Notes:
# - dc_chamber runs t0→drift→resi→reso for one chamber (BcOut by default).
# - D5 needs BcIn chamber done as well; uncomment the bcin dc_chamber line, or
#   finish BcIn separately before enabling d5_align
#   (see analyzer docs/d5_beam/D5_CALIBRATION_FLOW.md).
# - dc_resi alone remains available if only residual iteration is needed.

run: 3774
kaon: false
force: false
max_iter: 10
steps:
  - hodo
  - dc_chamber                 # BcOut t0→drift→resi→reso
  # - dc_chamber: {bcin: true} # BcIn full chain (needed before D5 on a fresh run)
  # - dc_resi                  # residual-only (legacy / already-calibrated stages)
  # - dc_resi: {allow_skip: true}
  - d5_align
