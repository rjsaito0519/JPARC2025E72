# Copy to slack_local.yml (gitignored) and fill in.
# cp calibration/config/slack_local.example.yml calibration/config/slack_local.yml
# chmod 600 calibration/config/slack_local.yml
enabled: true
token: xoxb-your-bot-token
channel_id: C0123456789

# Socket Mode ops bot (Block Kit buttons + /calib).
# Required for step_gate / Approve buttons. PDF posting works with enabled+token alone.
# Requires: pip install slack-bolt
# Cluster-wide: only one bot (ensure_slack_bot + heartbeat under results/calib/slack_bot/)
bot_enabled: false
app_token: xapp-your-app-level-token
allowed_user_ids:
  - U0123456789
# empty → only channel_id above is allowed
allowed_channel_ids: []
